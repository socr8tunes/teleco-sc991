name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.step }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        step: [gcc, clang, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang python3 python3-pip
          python3 -m pip install --user mpmath
      - name: Build and test
        run: tools/ci_local.sh ${{ matrix.step }}

  web:
    name: wasm simulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld nodejs python3-pip
          python3 -m pip install --user playwright && python3 -m playwright install --with-deps chromium
      - name: Build wasm and run the differential UI test
        run: tools/ci_local.sh wasm
      - uses: actions/upload-artifact@v4
        with:
          name: teleco-sc991-simulator
          path: build-web/teleco-sc991.html

  footprint:
    name: MCU footprint (cross-compile, size only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Measure
        run: tools/ci_local.sh footprint template
      - uses: actions/upload-artifact@v4
        with:
          name: footprint
          path: build-fp-*.txt
